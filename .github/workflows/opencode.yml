name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Write-права выданы на уровне jobs: воркфлоу получает пустой набор,
# чтобы ничего не наследовалось неявно.
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    # Номер issue/PR зашит в имя job: по нему «Check run budget» отличает
    # попытки этого тикета от прогонов по другим тикетам.
    # Доверенный автор проверяется здесь, до вызова модели и расхода
    # бюджета: чужой /oc делает запуск skipped, который не считается
    # попыткой и не порождает отчёт.
    name: opencode (PR #${{ github.event.issue.number || github.event.pull_request.number }})
    if: |
      github.event.comment.author_association == 'OWNER' &&
      (contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # id-token: write — OIDC-обмен на App-токен в экшене opencode.
    # actions: read — счётчик бюджета читает историю Actions; переписать
    #   историю GITHUB_TOKEN не может, агенту этот токен не выдаётся.
    permissions:
      id-token: write
      contents: read
      issues: read
      actions: read
    outputs:
      allowed: ${{ steps.budget.outputs.allowed }}
      count: ${{ steps.budget.outputs.count }}
      reason: ${{ steps.mark.outputs.reason || steps.guard.outputs.reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Бюджет проверяется кодом ДО вызова модели: исчерпанный предел
      # останавливает запуск без запроса к API модели.
      - name: Check run budget
        id: budget
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TICKET: ${{ github.event.issue.number || github.event.pull_request.number }}
          CREATED_AT: ${{ github.event.issue.created_at || github.event.pull_request.created_at }}
          BUDGET_LIMIT: '3'
        run: |
          set -euo pipefail
          # Попытки считаем по истории Actions — источнику, который токен
          # агента не может переписать. Один допущенный /oc — один запуск;
          # re-run, таймаут и отмена видны как рост run_attempt и тоже
          # расходуют попытку. Текущий запуск ещё не завершён, поэтому
          # фильтруем только пропущенные (запуск без /oc не стоит попытки).
          # Комментарий PR служит отчётом и на бюджет не влияет.
          # --paginate: после сотни прогонов по тикету история видна не
          # вся — без обхода страниц счётчик занижался бы.
          runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/opencode.yml/runs" \
            -f created=">=$CREATED_AT" -f per_page=100 --paginate \
            --jq '.workflow_runs[] | select(.event == "issue_comment" or .event == "pull_request_review_comment") | select(.conclusion != "skipped") | .id')"
          count=0
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            attempts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=10" \
              --jq "[.jobs[] | select(.name | contains(\"(PR #$TICKET)\")) | .run_attempt] | max // 0")"
            count=$((count + attempts))
          done <<< "$runs"
          echo "Бюджет: использовано $count из $BUDGET_LIMIT попыток"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt "$BUDGET_LIMIT" ]; then
            echo "allowed=no" >> "$GITHUB_OUTPUT"
            echo "::error::Предел запусков на этот issue/PR исчерпан ($count > $BUDGET_LIMIT)"
          else
            echo "allowed=yes" >> "$GITHUB_OUTPUT"
          fi

      # Отсутствие ключа — причина infra, фиксируется до вызова модели.
      - name: Guard secrets
        id: guard
        if: steps.budget.outputs.allowed == 'yes'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "reason=infra" >> "$GITHUB_OUTPUT"
            echo "Отсутствует OPENCODE_API_KEY — запуск невозможен."
            exit 1
          fi

      - name: Run opencode
        id: agent
        if: steps.budget.outputs.allowed == 'yes' && steps.guard.outcome == 'success'
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # имя секрета зависит от провайдера в model
        with:
          model: opencode/deepseek-v4.1-flash

      # Отделяем сбой самого агента от сбоя подготовки (бюджет, ключ):
      # шаг выполняется, только когда подготовка прошла успешно.
      - name: Mark agent failure
        id: mark
        if: >-
          failure() && steps.budget.outcome == 'success' && steps.guard.outcome == 'success'
        run: echo "reason=agent_failed" >> "$GITHUB_OUTPUT"

  # Итог публикует отдельное задание без модели и без секрета агента.
  report:
    name: report (PR #${{ github.event.issue.number || github.event.pull_request.number }})
    needs: opencode
    if: always() && needs.opencode.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # issues: write и pull-requests: write — только для отчётного комментария.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Publish refusal report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REASON: >-
            ${{ needs.opencode.outputs.allowed == 'no' && 'limit_exhausted'
            || needs.opencode.result == 'failure' && (needs.opencode.outputs.reason == 'agent_failed' && 'agent_failed' || 'infra')
            || '' }}
          ATTEMPTS: ${{ needs.opencode.outputs.count }}
          BUDGET_LIMIT: '3'
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$REASON" ]; then
            echo "Причин для отчёта нет — шаг завершается без комментария."
            exit 0
          fi
          # Фактический head PR важен для любой причины, не только
          # limit_exhausted: gh pr view работает и для issue_comment на PR.
          # Фолбэк github.sha — только для обычного issue, где PR нет.
          if gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid > /dev/null 2>&1; then
            sha="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          else
            sha="$EVENT_SHA"
          fi
          # Сегмент attempts (не attempt): форма /attempt/N даёт 404.
          logs_link="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          if [ "$REASON" = "limit_exhausted" ]; then
            detail="Использовано попыток: ${ATTEMPTS:-?} из $BUDGET_LIMIT. Новый бюджет получит только новый PR."
          else
            detail="Сбой запуска; если в логе таймаут — считать причину timeout, иначе infra/agent_failed."
          fi
          body="**Нужен человек** — запуск агента остановлен.

          - Причина: \`$REASON\`
          - $detail
          - Head SHA: \`$sha\`
          - Логи: $logs_link"
          gh issue comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
